  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css" type="text/css"/>
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>

  <!-- jQuery -->
  <script type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
  
  <!-- ol-ext -->
  <link rel="stylesheet" href="https://viglino.github.io/ol-ext/dist/ol-ext.css" />
  <script type="text/javascript" src="https://viglino.github.io/ol-ext/dist/ol-ext.js"></script>

   <!-- ol-mapbox-style -->
   <script src="https://cdn.jsdelivr.net/npm/ol-mapbox-style@9.7.0/dist/olms.js"></script>

  <style>
  </style>

<body>
  
  <div id="bandeau"> 
    <div id="logo_plui"> 
      <img src='https://raw.githubusercontent.com/mondarverne/webmap_plui_mac/main/IMAGES/Logo_plui.png', 
      alt="Logo PLUI" ></div>
    <div id="titre"> PLUi de Mond'Arverne Communauté </div>
    <div id="logo_mac">
      <img src='https://raw.githubusercontent.com/mondarverne/webmap_plui_mac/main/IMAGES/Logo_mac.png', 
      alt="Logo MAC"></div>
    </div>

  </div>
  <div class="container">

    <div class="sidebar">
      
      <div id="info_presentation">
      Pour connaître le zonage et les prescriptions d'une parcelle, remplissez les informations suivantes :
      </div>
      
      <label>
      Commune :
        <select id="selectCommune">
          <option value="">-- Sélectionner --</option>
        </select>
      </label>

      <label>
        Section :
        <select id="selectSection" disabled>
          <option value="">-- Sélectionner --</option>
        </select>
      </label>

      <label>
        Numéro :
        <select id="selectNumero" disabled>
          <option value="">-- Sélectionner --</option>
        </select>
      </label>
    
    <div id="info">
      Sélectionnez une parcelle pour afficher son zonage.
    </div>
  </div>



  <!-- Carte OpenLayers -->
 <div id="map"></div>
</div>
  
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
